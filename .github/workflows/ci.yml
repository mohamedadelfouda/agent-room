name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - name: Install dependencies without desktop postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax check (all server/ + public/ files)
        run: pnpm check
      - name: Unit tests
        run: pnpm test
