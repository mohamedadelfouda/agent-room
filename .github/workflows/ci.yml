name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check (all server/ + public/ files)
        run: npm run check
      - name: Unit tests
        run: npm test
