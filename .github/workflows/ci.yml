name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install dependencies without desktop postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax check (all server/ + public/ files)
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  source-smoke:
    name: source-only smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install source-server production graph
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Source-server smoke
        run: pnpm test:smoke
      - name: Audit source-server production graph
        if: runner.os == 'Linux'
        # Advisory only: the audit depends on an external registry endpoint that can be
        # unavailable or retired, so a transport failure must not fail the source-run gate.
        continue-on-error: true
        run: pnpm audit --prod

  quality:
    name: lint + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install lint + coverage toolchain
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Critical behavior coverage
        run: pnpm test:coverage

  browser:
    name: browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install source-server production graph
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Browser checks
        run: pnpm test:browser
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
