name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install dependencies without desktop postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Syntax check (all server/ + public/ files)
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  source-smoke:
    name: source-only smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install source-server production graph
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Source-server smoke
        run: pnpm test:smoke
      - name: Audit source-server production graph
        if: runner.os == 'Linux'
        # Advisory only: the audit depends on an external registry endpoint that can be
        # unavailable or retired, so a transport failure must not fail the source-run gate.
        continue-on-error: true
        run: pnpm audit --prod

  quality:
    name: lint + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install lint + coverage toolchain
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Critical behavior coverage
        run: pnpm test:coverage

  browser:
    name: responsive browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.12.1
          run_install: false
      - name: Install source-server production graph
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Responsive browser checks
        run: pnpm test:browser
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: responsive-browser-failure
          path: test-results/responsive-shell-failure.png
          if-no-files-found: ignore
