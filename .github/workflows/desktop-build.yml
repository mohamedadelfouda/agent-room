name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  make:
    name: ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # A tagged release must be internally consistent before anything is built: the tag, package.json's
      # version, and a matching CHANGELOG section have to agree, so a release can never be mislabeled or
      # undocumented. Fails the build (and therefore the dependent release job) on any mismatch.
      - name: Verify release tag matches package.json and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash # pin bash so "$TAG_NAME" resolves the same on the Windows runner (default pwsh) as on Linux/macOS
        env:
          TAG_NAME: ${{ github.ref_name }} # via env, not inline ${{ }}, to avoid shell-injection from a crafted tag
        run: node scripts/check-release-version.mjs "$TAG_NAME"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1
          run_install: false
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate source
        run: pnpm run ci
      # Signing engages per platform ONLY when that platform's full secret set is
      # present. With no secrets (e.g. the first public release) the build is
      # unsigned instead of failing — users then see SmartScreen / Gatekeeper
      # warnings. Add the secrets later to get signed + notarized builds with no
      # further workflow change.
      - name: Detect signing availability
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          win=false
          mac=false
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then win=true; fi
          if [ -n "$MAC_CERTIFICATE_BASE64" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then mac=true; fi
          echo "win=$win" >> "$GITHUB_OUTPUT"
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "Windows signing: $win; macOS signing: $mac"
      - name: Prepare Windows signing
        if: runner.os == 'Windows' && steps.signing.outputs.win == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "agent-room-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && steps.signing.outputs.mac == 'true'
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/agent-room-signing.p12"
          keychain="$RUNNER_TEMP/agent-room-signing.keychain-db"
          printf '%s' "$MAC_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$GITHUB_RUN_ID" "$keychain"
          security import "$certificate" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$GITHUB_RUN_ID" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build installer (signed when certificates are configured, unsigned otherwise)
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.win == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ steps.signing.outputs.mac == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.mac == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.mac == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm make
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-room-${{ matrix.platform }}-${{ github.ref_name }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # An unsigned build must never silently become an official signed release. When the
      # full signing secret set is absent the installers are unsigned, so publish the tag as
      # a pre-release (clearly labelled, not marked "Latest"). Add the secrets and it promotes
      # to a normal release with no workflow change.
      - name: Determine release channel
        id: channel
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A prerelease tag (vX.Y.Z-rc.1, -beta, …) must publish as a pre-release regardless of signing —
          # otherwise a fully-signed RC would be promoted to a normal/"Latest" GitHub release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a prerelease tag — publishing as a pre-release."
          elif [ -n "$WINDOWS_CERTIFICATE_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ] \
             && [ -n "$MAC_CERTIFICATE_BASE64" ] && [ -n "$MAC_CERTIFICATE_PASSWORD" ] \
             && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets incomplete — publishing $GITHUB_REF_NAME as an unsigned pre-release."
          fi
      - name: Create release and upload every native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then channel_flag="--prerelease"; else channel_flag=""; fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $channel_flag --generate-notes --title "Agent Room $GITHUB_REF_NAME"
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done

  npm-publish:
    name: Publish the CLI to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # npm distribution (so `npx agent-room` works) is optional and dormant until the maintainer adds an
      # NPM_TOKEN secret — the same "engage only when the secret is present" pattern as code signing
      # above. With no token the publish is skipped (not failed), so a desktop-only release still
      # succeeds. `needs: make` means the whole matrix build + tests (and the tag/version/CHANGELOG check)
      # passed first; the package is zero-deps and ships only bin/server/public/desktop.
      - name: Detect npm token
        id: npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN not set — skipping npm publish (desktop release still runs)."
          fi
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A prerelease tag (vX.Y.Z-rc.1, -beta, …) publishes under the "next" dist-tag, never "latest",
          # so `npx agent-room` (which installs latest) can't resolve to an RC/beta. Stable tags keep default.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
